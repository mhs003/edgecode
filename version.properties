# The app version. Single source of truth: build.gradle.kts reads this file.
#
# versionCode must increase by exactly one on every published build — Android
# will not install an APK whose versionCode is lower than the installed one.
# versionName is the human-facing MAJOR.MINOR.PATCH and doubles as the git tag
# (`v1.0.0`) that the release workflow publishes.
#
# Never edit these by hand: run scripts/bump-version.sh, which keeps the two in
# step and refuses to move backwards.
versionCode=9
versionName=1.2.2
